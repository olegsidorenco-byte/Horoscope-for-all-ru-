name: Build Android APK

on:
  push:
    paths:
      - 'mobile_app/**'
      - 'data/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: # Кнопка ручной сборки в GitHub Actions

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare native Android project and icons
        run: |
          mkdir -p mobile_app/assets/data/archive
          cp -r data/* mobile_app/assets/data/ || true
          cd mobile_app
          rm -rf android
          flutter create --platforms=android --org com.cosmic .
          
          # Устанавливаем русское название приложения на смартфоне: Астро Гороскоп
          sed -i 's/android:label="[^"]*"/android:label="Астро Гороскоп"/g' android/app/src/main/AndroidManifest.xml
          
          # Устанавливаем необходимые системные разрешения
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>' android/app/src/main/AndroidManifest.xml
          fi
          
          # Включение coreLibraryDesugaring для поддержки flutter_local_notifications
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo 'dependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4" }' >> android/app/build.gradle
          fi

          flutter pub get
          dart run flutter_launcher_icons

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Horoscope-for-all-ru.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horoscope-for-all-ru-apk
          path: mobile_app/build/app/outputs/flutter-apk/Horoscope-for-all-ru.apk
          if-no-files-found: error

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: app-v1.0.7
          name: "📱 Релиз Horoscope-for-all-ru.apk v1.0.7 (Астро Гороскоп)"
          body: "Готовый установочный файл Horoscope-for-all-ru.apk для Android. Полностью устранены любые обрезания текста на кнопках стихий и фильтров."
          files: mobile_app/build/app/outputs/flutter-apk/Horoscope-for-all-ru.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
