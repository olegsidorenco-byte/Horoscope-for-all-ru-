name: Build Android APK

on:
  push:
    paths:
      - 'mobile_app/**'
      - 'data/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch: # Кнопка ручной сборки в GitHub Actions

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare native Android project, permanent keystore and icons
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p mobile_app/assets/data/archive
          cp -r data/* mobile_app/assets/data/ || true
          cd mobile_app
          rm -rf android
          flutter create --platforms=android --org com.cosmic .
          
          # Устанавливаем русское название приложения на смартфоне: Астро Гороскоп
          sed -i 's/android:label="[^"]*"/android:label="Астро Гороскоп"/g' android/app/src/main/AndroidManifest.xml
          
          # Копируем нативные Kotlin компоненты (Foreground Service, BootReceiver, MainActivity с MethodChannel)
          mkdir -p android/app/src/main/kotlin/com/cosmic/cosmic_horoscope
          cp -f android_custom/* android/app/src/main/kotlin/com/cosmic/cosmic_horoscope/

          # Устанавливаем необходимые системные разрешения и разрешения для бейджей на рабочих столах
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n    <uses-permission android:name="com.sec.android.provider.badge.permission.READ"/>\n    <uses-permission android:name="com.sec.android.provider.badge.permission.WRITE"/>\n    <uses-permission android:name="com.htc.launcher.permission.READ_SETTINGS"/>\n    <uses-permission android:name="com.htc.launcher.permission.UPDATE_SHORTCUT"/>\n    <uses-permission android:name="com.sonyericsson.home.permission.BROADCAST_BADGE"/>\n    <uses-permission android:name="com.sony.home.permission.BROADCAST_BADGE"/>\n    <uses-permission android:name="com.anddoes.launcher.permission.UPDATE_COUNT"/>\n    <uses-permission android:name="com.majeur.launcher.permission.UPDATE_BADGE"/>\n    <uses-permission android:name="com.huawei.android.launcher.permission.CHANGE_BADGE"/>\n    <uses-permission android:name="com.huawei.android.launcher.permission.READ_SETTINGS"/>\n    <uses-permission android:name="com.huawei.android.launcher.permission.WRITE_SETTINGS"/>\n    <uses-permission android:name="android.permission.READ_APP_BADGE"/>\n    <uses-permission android:name="com.oppo.launcher.permission.READ_SETTINGS"/>\n    <uses-permission android:name="com.oppo.launcher.permission.WRITE_SETTINGS"/>\n    <uses-permission android:name="me.everything.badger.permission.BADGE_COUNT_READ"/>\n    <uses-permission android:name="me.everything.badger.permission.BADGE_COUNT_WRITE"/>' android/app/src/main/AndroidManifest.xml
          fi

          # Добавляем ресиверы и службу в AndroidManifest.xml (включая реакцию на смену часового пояса TIMEZONE_CHANGED / TIME_SET)
          sed -i '/<\/application>/i \        <service android:name="com.cosmic.cosmic_horoscope.HoroscopeBackgroundService" android:enabled="true" android:exported="false" />\n        <receiver android:name="com.cosmic.cosmic_horoscope.HoroscopeAlarmReceiver" android:enabled="true" android:exported="false"/>\n        <receiver android:name="com.cosmic.cosmic_horoscope.BootReceiver" android:enabled="true" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.TIMEZONE_CHANGED"/>\n                <action android:name="android.intent.action.TIME_SET"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n            </intent-filter>\n        </receiver>\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n                <action android:name="android.intent.action.TIMEZONE_CHANGED"/>\n                <action android:name="android.intent.action.TIME_SET"/>\n                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n            </intent-filter>\n        </receiver>' android/app/src/main/AndroidManifest.xml
          
          # Включение coreLibraryDesugaring для поддержки flutter_local_notifications
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts
            echo 'dependencies { coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4") }' >> android/app/build.gradle.kts
          fi
          if [ -f android/app/build.gradle ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' android/app/build.gradle
            echo 'dependencies { coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4" }' >> android/app/build.gradle
          fi

          # Копируем цифровой сертификат подписи (приоритет GitHub Secrets с безопасным откатом)
          mkdir -p android/app
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            cp keystore/release.keystore android/app/release.keystore
          fi
          KS_ALIAS="${KEY_ALIAS:-cosmic_key}"
          KS_PASS="${KEYSTORE_PASSWORD:-cosmic_pass_2026}"
          K_PASS="${KEY_PASSWORD:-cosmic_pass_2026}"
          
          # Настройка Firebase: Копируем google-services.json и внедряем плагины в Gradle (.gradle и .kts)
          if [ -f android_custom/google-services.json ]; then
            cp android_custom/google-services.json android/app/
            
            # Groovy DSL
            if [ -f android/build.gradle ]; then
              sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.2"' android/build.gradle
            fi
            if [ -f android/app/build.gradle ]; then
              echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
              sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle
            fi

            # Kotlin DSL (.kts)
            if [ -f android/settings.gradle.kts ] && ! grep -q "com.google.gms.google-services" android/settings.gradle.kts; then
              sed -i '/id("com.android.application")/a \    id("com.google.gms.google-services") version "4.4.2" apply false' android/settings.gradle.kts
            fi
            if [ -f android/app/build.gradle.kts ]; then
              if ! grep -q "com.google.gms.google-services" android/app/build.gradle.kts; then
                sed -i '/id("com.android.application")/a \    id("com.google.gms.google-services")' android/app/build.gradle.kts
              fi
              sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' android/app/build.gradle.kts
            fi
          fi

          # Настройка постоянной цифровой подписи (Release Keystore) для бесшовных обновлений APK
          if [ -f android/app/build.gradle.kts ]; then
            sed -i "/buildTypes {/i \    signingConfigs {\n        create(\"release\") {\n            keyAlias = \"${KS_ALIAS}\"\n            keyPassword = \"${K_PASS}\"\n            storeFile = file(\"release.keystore\")\n            storePassword = \"${KS_PASS}\"\n        }\n    }" android/app/build.gradle.kts
            sed -i 's/signingConfig = signingConfigs.getByName("debug")/signingConfig = signingConfigs.getByName("release")/g' android/app/build.gradle.kts
            sed -i '/getByName("release") {/a \            signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts
          fi

          if [ -f android/app/build.gradle ]; then
            sed -i "/buildTypes {/i \    signingConfigs {\n        release {\n            keyAlias \"${KS_ALIAS}\"\n            keyPassword \"${K_PASS}\"\n            storeFile file(\"release.keystore\")\n            storePassword \"${KS_PASS}\"\n        }\n    }" android/app/build.gradle
            sed -i 's/signingConfig signingConfigs.debug/signingConfig signingConfigs.release/g' android/app/build.gradle
          fi

          flutter pub get
          echo "🔍 Проверка устаревших зависимостей Flutter (flutter pub outdated)..."
          flutter pub outdated || true
          dart run flutter_launcher_icons

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Horoscope-for-all-ru.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Horoscope-for-all-ru-apk
          path: mobile_app/build/app/outputs/flutter-apk/Horoscope-for-all-ru.apk
          if-no-files-found: error

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(grep '^version:' mobile_app/pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | tr -d ' "\r\n')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extracted App Version: ${VERSION}"

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: app-v${{ steps.app_version.outputs.version }}
          name: "📱 Релиз Horoscope-for-all-ru.apk v${{ steps.app_version.outputs.version }} (Астро Гороскоп)"
          body: |
            Готовый установочный файл Horoscope-for-all-ru.apk для Android (версия v${{ steps.app_version.outputs.version }}).
            
            ✨ Ключевые улучшения в версии v${{ steps.app_version.outputs.version }}:
            • 🌍 Часовой пояс пользователя и предгенерация: время доставки и уведомлений рассчитывается строго по часовому поясу смартфона (включая дробные пояса и перелеты), а при смещении суток или раннем времени до 06:30 прогноз формируется заранее под вашу дату.
            • 🪐 Высшая натальная точность по дате и времени рождения: точный сферический расчет Асцендента, Середины Неба (MC) и домов при известном времени рождения либо чистая Солнечная космограмма без искажений.
            • 🗂️ Полная структура персонального прогноза: облачный расчет раскладывается по всем 6 тематическим карточкам дня с умным оффлайн-кэшем и мгновенным пересчетом при обновлении анкеты.
            • 🔔 Бесшумная предзагрузка за 30 минут до выбранного времени и устранение лишних фоновых срабатываний.
            • 🔐 Синхронизация анкеты, времени доставки и часового пояса с Firebase / Cloud Run + корректный сброс пароля и удаление аккаунта.
          files: mobile_app/build/app/outputs/flutter-apk/Horoscope-for-all-ru.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
