name: Daily Horoscope Bot

on:
  schedule:
    # Запуск каждый день в 02:40 UTC (05:40 МСК, на 30 минут раньше прежнего 03:10 UTC)
    - cron: '40 2 * * *'
  workflow_dispatch: # Кнопка для ручного запуска в интерфейсе GitHub

permissions:
  contents: write

jobs:
  run-horoscope:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and security scanner
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run Security and CVE Dependency Audit
        run: |
          echo "🔍 Сканирование зависимостей на уязвимости (pip-audit)..."
          pip-audit || true
          echo "🧪 Запуск тестов безопасности и астрономической логики..."
          python test_security_and_logic.py

      - name: Run daily horoscope
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push updated archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Архив не изменился."
          else
            git commit -m "🗄️ Автоматическое сохранение гороскопа в архив [skip ci]"
            git push origin main
          fi
