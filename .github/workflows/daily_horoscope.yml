name: Daily Horoscope Bot

on:
  schedule:
    # Запуск каждый день в 03:10 UTC (на 23 минуты раньше прежнего 03:33 UTC)
    - cron: '10 3 * * *'
  workflow_dispatch: # Кнопка для ручного запуска в интерфейсе GitHub

permissions:
  contents: write

jobs:
  run-horoscope:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily horoscope
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push updated archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Архив не изменился."
          else
            git commit -m "🗄️ Автоматическое сохранение гороскопа в архив [skip ci]"
            git push origin main
          fi
